<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas de Filmes</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            border: 1px solid black;
            border-collapse: collapse;
            width: 600px;
            margin: auto;
        }

        thead tr {
            text-align: center;
        }
        tr {
            border: 1px solid black;
            
        }

        td {
            border: 1px solid black;
            padding: 10px;
            
        }

    </style>
</head>
<body>
    <table>
        <thead >
            <tr>
                <td>
                    <strong>
                            Grupo
                    </strong>
                </td>
                <td>
                    <strong>
                            Nome
                    </strong>
                </td>
                <td colspan="3">
                    <strong>
                            Filme
                    </strong>
                </td>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th rowspan="3">
                    <strong>
                        Mulheres
                    </strong>
                </th>
                <td>Ana Maria</td>
                <td>Alien</td>
                <td>Rambo</td>               
                <td>Vingadores</td>
            </tr>
            <tr>
                <td>Beatriz Souza</td>
                <td>Hulk</td>
                <td>Inception</td>
                <td>batman</td>
            </tr>
            <tr>
                <td>Cáudia Melo</td>
                <td>Oblivion</td>
                <td>Matrix</td>
                <td>Big Hero</td>
            </tr>
            <tr>
                <th rowspan="3" >
                    <strong>
                        Homens
                    </strong>
                </th> 
                <td>Bruno Mendonça</td>
                <td>Intocáveis</td>
                <td>Amnésia</td>
                <td>Gladiador</td>
            </tr>
            <tr>
                <td>Daniel Lourenço</td>
                <td>Wall-E</td>
                <td>Oldboy</td>
                <td>Dangal</td>
            </tr>
            <tr>
                <td>Fabiano Mota</td>
                <td>Sta Wars 5</td>
                <td>Taxi Driver</td>
                <td>Toy Story</td>
            </tr>

        </tbody>
    </table>
    
</body>
</html>
