<!DOCTYPE html>
<html lang="pt-br
">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Iframe</title>
        <style>
            body {
                font-family: Arial, Helvetica, sans-serif;
            }

            iframe {
                width: 150;
                height:250;
                border: 1px solid red;
            }
        </style>
    </head>
    <body>
        <h1>Testando o uso de um Iframe</h1>

        <p>
            Acessando o site do 
            <iframe src="https://cursoemvideo.com" frameborder="1">
                <a href="https://cursoemvideo.com" target="_blank">Curso em video
                </a>
            </iframe> para aprender a programar.
        </p>

        <p>
            O repositório do Guanabara
            <iframe src="https://gustavoguanabara.github.io" frameborder="1" scolling="no">
                <a href="https://gustavoguanabara.github.io" target="_blank">
                no GitHub</a>
            </iframe> 
            também é bem legal.
        </p>

        
    </body>
</html>
